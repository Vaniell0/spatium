name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only run the latest push for each branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-build:
    name: nix build (gcc15 + viewer + Eigen)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build default package
        run: nix build .#default --print-build-logs

      - name: Configure for tests
        run: |
          nix develop --command bash -c '
            cmake -B build-ci -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSPATIUM_BUILD_VIEWER=OFF \
              -DSPATIUM_BUILD_BENCHMARKS=OFF \
              -DSPATIUM_BUILD_TESTS=ON \
              -DSPATIUM_EIGEN=ON \
              -DSPATIUM_BOOST=ON
          '

      - name: Build tests
        run: |
          nix develop --command bash -c 'cmake --build build-ci -j'

      - name: Run tests
        run: |
          nix develop --command bash -c \
            'ctest --test-dir build-ci --output-on-failure -j'

  modules-build:
    name: C++23 modules build (SPATIUM_USE_MODULES=ON)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure (modules preset)
        run: nix develop --command bash -c 'cmake --preset modules'

      - name: Build
        run: nix develop --command bash -c 'cmake --build --preset modules -j'

      - name: Run tests
        run: nix develop --command bash -c 'ctest --preset modules --output-on-failure -j'

  dependency-graph:
    name: dependency graph is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check docs/dependency-graph.dot matches the real #include graph
        run: python3 scripts/gen_dependency_graph.py --check

  claude-md-layout:
    name: CLAUDE.md directory layout is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check CLAUDE.md mentions every real include/spatium/ subdirectory
        run: python3 scripts/check_claude_md_layout.py

  doc-file-refs:
    name: docs name only files that exist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check every source file named in the docs is in the tree
        run: python3 scripts/check_doc_file_refs.py

  bare-build:
    name: cmake build without Nix (gcc15)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-15 g++-15 cmake ninja-build catch2 libeigen3-dev libboost-dev
          # catch2 is not optional when SPATIUM_BUILD_TESTS is on:
          # CMakeLists.txt's find_package(Catch2 3) is REQUIRED with no
          # FetchContent fallback. (A comment here used to claim there was
          # one; there is not, and two new jobs below were written against
          # that claim and failed on it.)
          # libboost-dev backs SPATIUM_BOOST=ON below (Real50/Real100 tests
          # and the RSC precision domain). Header-only, so the -dev
          # metapackage is enough and no boost libs need linking. Boost is
          # optional as of the SPATIUM_BOOST option -- this job installs it
          # deliberately so CI keeps gating the full test set.

      - name: Configure
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPATIUM_BUILD_VIEWER=OFF \
            -DSPATIUM_BUILD_BENCHMARKS=OFF \
            -DSPATIUM_BUILD_EXAMPLES=ON \
            -DSPATIUM_EIGEN=ON \
            -DSPATIUM_BOOST=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -j

  debug-build:
    name: Debug build (asserts actually run)
    runs-on: ubuntu-24.04
    # Every other job here builds Release, so NDEBUG removes assert() and
    # a whole class of defect passes CI green: misusing a dependency in a
    # way that dependency catches with an assertion. That is not
    # hypothetical. tests/test_svd.cpp asked Eigen::JacobiSVD for thin
    # U/V on a fixed-size matrix, which Eigen allows only when the column
    # count is dynamic and otherwise asserts. CI never saw it. Worse, a
    # local Debug run had seen it abort, and when someone later observed
    # the test passing in Release the roadmap recorded that as "the old
    # failure note went stale" -- so the Release-only matrix did not just
    # hide the bug, it manufactured a wrong explanation for it.
    #
    # Eigen on, Boost off: Eigen is the dependency whose asserts we are
    # here to run, while Boost.Multiprecision's Real50/Real100 tests are
    # slow enough in an unoptimised build to dominate the job for no
    # added coverage of this specific class.
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-15 g++-15 cmake ninja-build catch2 libeigen3-dev

      - name: Configure
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          cmake -B build-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSPATIUM_BUILD_VIEWER=OFF \
            -DSPATIUM_BUILD_BENCHMARKS=OFF \
            -DSPATIUM_BUILD_EXAMPLES=OFF \
            -DSPATIUM_EIGEN=ON \
            -DSPATIUM_BOOST=OFF

      - name: Build
        run: cmake --build build-debug -j

      - name: Test
        run: ctest --test-dir build-debug --output-on-failure -j

  bare-build-no-boost:
    name: cmake build with no optional deps at all (gcc15)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          # Deliberately no libboost-dev and no libeigen3-dev: this job is
          # the standing proof that both are genuinely optional. It is the
          # configuration someone evaluating Spatium gets from a bare
          # `cmake -B build` on a machine with nothing installed, which is
          # what core/precision.hpp used to break outright.
          # catch2 is here because it is a test-harness dependency, not one
          # of the optional library features under test, and find_package
          # for it is REQUIRED.
          sudo apt-get install -y --no-install-recommends \
            gcc-15 g++-15 cmake ninja-build catch2

      - name: Configure
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPATIUM_BUILD_VIEWER=OFF \
            -DSPATIUM_BUILD_BENCHMARKS=OFF \
            -DSPATIUM_BUILD_EXAMPLES=ON \
            -DSPATIUM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -j

      - name: Umbrella headers compile with nothing but -Iinclude
        run: |
          # The narrowest possible statement of the regression, independent
          # of CMake: no options, no defines, no package anywhere.
          printf '#include <spatium/spatium.hpp>\nint main(){}\n' > /tmp/umbrella.cpp
          printf '#include <spatium/core.hpp>\nint main(){}\n'    > /tmp/core.cpp
          g++-15 -std=c++23 -fsyntax-only -Iinclude /tmp/umbrella.cpp
          g++-15 -std=c++23 -fsyntax-only -Iinclude /tmp/core.cpp

  external-consumer:
    name: downstream FetchContent consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-15 g++-15 cmake ninja-build

      - name: Configure and build the standalone consumer project
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          # examples/external-consumer is its own independent CMake project
          # and its FetchContent_Declare points at GIT_TAG main, so left
          # alone this would test main rather than the commit under review.
          # FETCHCONTENT_SOURCE_DIR_SPATIUM redirects it at this checkout,
          # which is the only way the job actually gates the PR.
          cmake -S examples/external-consumer -B build-consumer -G Ninja \
            -DFETCHCONTENT_SOURCE_DIR_SPATIUM=${{ github.workspace }}
          cmake --build build-consumer -j

      - name: Run it
        run: ./build-consumer/sphere_distance_demo

  installed-consumer:
    name: installed package + find_package(Spatium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-15 g++-15 cmake ninja-build

      # The other consumer job proves FetchContent. This one proves the
      # *other* way a project picks Spatium up, and it is the one that was
      # never checked: install(EXPORT SpatiumTargets), the generated
      # SpatiumConfig.cmake and the version file have shipped since before
      # the first release with nothing in CI ever installing them. A
      # package config nobody consumes is a mechanism with nothing running
      # it -- see docs/conventions.md, "A check needs the thing that runs
      # it, first".
      #
      # Deliberately a per-push job rather than something that runs on a
      # release tag. A check that only runs at a release runs once, at the
      # worst possible moment to discover it was broken.
      - name: Build and install to a prefix
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          cmake -B build-lib -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/prefix \
            -DSPATIUM_BUILD_TESTS=OFF \
            -DSPATIUM_BUILD_VIEWER=OFF \
            -DSPATIUM_BUILD_EXAMPLES=OFF \
            -DSPATIUM_BUILD_BENCHMARKS=OFF \
            -DSPATIUM_USE_MODULES=OFF
          cmake --build build-lib -j
          cmake --install build-lib

      - name: Configure the standalone consumer against the install tree
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          cmake -S examples/external-consumer -B build-fp -G Ninja \
            -DSPATIUM_CONSUME=find_package \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/prefix
          cmake --build build-fp -j

      - name: Run it
        run: ./build-fp/sphere_distance_demo

  clang:
    name: clang 19 (libstdc++, no optional deps)
    runs-on: ubuntu-24.04
    # This was expected to be red on introduction -- nothing in the tree had
    # ever been compiled by anything but GCC, and std::print appears in 25
    # example and test files. It passed on the first run that got as far as
    # compiling: 871/871 tests green under clang 19 + libstdc++ 14. So it is
    # blocking from the start rather than advisory; a clang break should fail
    # CI like any other.
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          sudo add-apt-repository -y \
            "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main"
          sudo apt-get update
          # libstdc++-14-dev, not libc++: libstdc++ 14 is the first with
          # <print>, and pairing clang with the platform's own standard
          # library is what a downstream user on Linux actually has.
          # clang-tools-19 provides clang-scan-deps. CMake 3.28+ runs
          # module dependency scanning for any C++20-or-later target under
          # Ninja even when SPATIUM_USE_MODULES is off, and g++ has that
          # scanner built in while clang ships it as a separate package --
          # without it the build dies at
          # CMAKE_CXX_COMPILER_CLANG_SCAN_DEPS-NOTFOUND before compiling
          # a single file.
          sudo apt-get install -y --no-install-recommends \
            clang-19 clang-tools-19 libstdc++-14-dev cmake ninja-build catch2

      - name: Configure
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          cmake -B build-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPATIUM_BUILD_VIEWER=OFF \
            -DSPATIUM_BUILD_BENCHMARKS=OFF \
            -DSPATIUM_BUILD_EXAMPLES=ON \
            -DSPATIUM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-clang -j

      - name: Test
        run: ctest --test-dir build-clang --output-on-failure -j
