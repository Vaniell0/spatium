<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spatium calculator</title>
<meta name="description" content="An engineering calculator that answers with the steps it took and what the answer is worth.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="style.css">
<script>
  // the theme and text size before the first paint, so the page does not flash
  try {
    const s = JSON.parse(localStorage.getItem("spatium.settings") || "{}");
    if (s.theme === "light" || s.theme === "dark") document.documentElement.dataset.theme = s.theme;
    if (s.scale) document.documentElement.style.setProperty("--scale", s.scale);
  } catch {}
</script>
<script defer src="vendor/katex/katex.min.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<a class="skip" href="#result">Skip to result</a>

<header class="bar">
  <a class="mark" href="#solve">spatium</a>
  <nav class="tabs" aria-label="Sections">
    <a href="#solve" data-tab="solve">Solve</a>
    <a href="#gallery" data-tab="gallery">Gallery</a>
    <a href="#reference" data-tab="reference">Reference</a>
    <a href="#scene" data-tab="scene">Scene</a>
  </nav>
  <button class="icon" id="open-settings" type="button" aria-label="Settings" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.4 7.4 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4 1 2-3.4Z"/></svg>
  </button>
</header>

<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<main>
  <section id="tab-solve" data-view="solve" hidden>
    <form class="ask" id="ask" autocomplete="off">
      <label class="sr" for="question">Question</label>
      <div class="line">
        <input id="question" name="q" spellcheck="false" autocapitalize="off"
               placeholder="2x^2 - 3x - 5 = 0" aria-describedby="hint">
        <button class="icon" id="open-keys" type="button" aria-label="Keyboard" aria-controls="keys" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h1M9.5 10h1M13 10h1M16.5 10h1M7 14h10"/></svg>
        </button>
        <button class="icon" id="focus" type="button" aria-label="Focus" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        </button>
        <button class="go" type="submit">Solve</button>
      </div>
      <div class="preview" id="preview" aria-live="polite"></div>
      <p class="hint" id="hint"></p>
    </form>

    <article class="sheet" id="result" tabindex="-1" aria-live="polite"></article>
  </section>

  <section id="tab-gallery" data-view="gallery" hidden>
    <h1>Gallery</h1>
    <div class="cards" id="cards"></div>
    <article class="sheet" id="card-sheet" hidden></article>
  </section>

  <section id="tab-reference" data-view="reference" hidden>
    <h1>Reference</h1>
    <div id="reference"></div>
  </section>

  <section id="tab-scene" data-view="scene" hidden>
    <h1>Scene</h1>
    <div id="scene"></div>
  </section>
</main>

<aside class="keys" id="keys" aria-label="Keyboard" hidden></aside>

<dialog class="settings" id="settings" aria-labelledby="settings-title">
  <form method="dialog">
    <div class="settings-head">
      <h2 id="settings-title">Settings</h2>
      <button class="icon" value="close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <fieldset>
      <legend>Theme</legend>
      <div class="seg" data-setting="theme">
        <button type="button" value="system">System</button>
        <button type="button" value="light">Light</button>
        <button type="button" value="dark">Dark</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>Text size</legend>
      <div class="seg" data-setting="scale">
        <button type="button" value="0.9">Small</button>
        <button type="button" value="1">Normal</button>
        <button type="button" value="1.15">Large</button>
        <button type="button" value="1.3">Larger</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>Digits shown</legend>
      <div class="seg" data-setting="digits">
        <button type="button" value="6">6</button>
        <button type="button" value="12">12</button>
        <button type="button" value="17">17</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>Formulas</legend>
      <div class="seg" data-setting="formulas">
        <button type="button" value="rendered">Rendered</button>
        <button type="button" value="source">LaTeX source</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>On-screen keyboard</legend>
      <div class="seg" data-setting="keyboard">
        <button type="button" value="on">On</button>
        <button type="button" value="off">Off</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>Core</legend>
      <div class="seg" data-setting="cache">
        <button type="button" value="on">Keep in this browser</button>
        <button type="button" value="off">Load each time</button>
      </div>
      <div class="core-row">
        <span id="core-state">Not loaded</span>
        <button type="button" class="quiet" id="check-update">Check for update</button>
      </div>
    </fieldset>
  </form>
</dialog>
</body>
</html>
